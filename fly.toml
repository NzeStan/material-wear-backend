# fly.toml app configuration file generated for material-wear-backend on 2026-08-20T08:07:38+01:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'material-wear-backend'
primary_region = 'lhr'
console_command = '/code/manage.py shell'

[build]
[deploy]
  # createcachetable is idempotent (checks for the table before creating),
  # safe to run on every deploy. Needed for the DB-backed cache used by
  # DRF's rate-limiting throttles (AnonRateThrottle etc.) — a separate
  # command from migrate, not covered by it.
  # Wrapped in `sh -c` explicitly — release_command is exec'd directly (no
  # shell), so `&&` chaining is otherwise passed as literal arguments to
  # the first command instead of being interpreted.
  release_command = 'sh -c "python manage.py migrate --noinput && python manage.py createcachetable"'

[env]
  PORT = '8000'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024

[[statics]]
  # STATIC_ROOT in settings.py is "staticfiles" (collectstatic's output) —
  # not "static" (STATICFILES_DIRS, the source assets). Fly's scanner
  # defaulted to the wrong one; pointing at it would have served stale/empty
  # static files at the edge, bypassing Django/whitenoise entirely.
  guest_path = '/code/staticfiles'
  url_prefix = '/static/'
